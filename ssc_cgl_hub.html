<title>Exam Prep Hub</title>
<style>
:root{
  --bg:#070714;--bg2:#0d0d22;--bg3:var(--bg3);--bg4:var(--border);
  --border:var(--border);--border2:var(--border2);
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --nav-bg:var(--nav-bg);
}
body.light{
  --bg:#f0f4ff;--bg2:#ffffff;--bg3:#f8faff;--bg4:#e8edf5;
  --border:#dde3f0;--border2:#c8d0e0;
  --text:#1e293b;--text2:#475569;--text3:#94a3b8;
  --nav-bg:#ffffff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;transition:background .3s,color .3s}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,textarea,select{font-family:inherit}
::-webkit-scrollbar{display:none}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:80px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--nav-bg);border-top:1px solid #1e1e40;display:flex;z-index:200;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:transparent;border:none;cursor:pointer;transition:all .15s}
.nav-icon{font-size:20px;line-height:1;transition:transform .2s}
.nav-label{font-size:10px;color:var(--text3);font-weight:500;transition:color .15s}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-btn.active .nav-label{color:#4361ee;font-weight:700}

/* ── CARDS ── */
.card{background:var(--bg2);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card-sm{background:var(--bg2);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.glass{background:rgba(13,13,34,0.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

/* ── TYPOGRAPHY ── */
.h1{font-size:22px;font-weight:900;line-height:1.2}
.h2{font-size:17px;font-weight:800}
.h3{font-size:14px;font-weight:700}
.body{font-size:13px;line-height:1.5}
.caption{font-size:11px;color:var(--text3)}
.muted{color:var(--text3)}

/* ── BUTTONS ── */
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;border:none;transition:all .15s;background:linear-gradient(135deg,var(--c,#4361ee),var(--c2,#7b2ff7));color:#fff}
.btn-primary:active{transform:scale(0.97)}
.btn-outline{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--c,#4361ee);background:var(--c,#4361ee)15;color:var(--c,#4361ee);transition:all .15s}
.btn-ghost{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:#64748b;transition:all .15s}
.btn-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2);background:var(--bg2);cursor:pointer;font-size:18px;transition:all .15s}

/* ── PROGRESS ── */
.bar-track{background:var(--border);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .6s ease}

/* ── GRID ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ── STAT BOX ── */
.stat{border-radius:12px;padding:12px 10px;text-align:center}
.stat-val{font-size:20px;font-weight:900;line-height:1.1}
.stat-lbl{font-size:10px;color:#64748b;margin-top:3px}
.stat-sub{font-size:10px;margin-top:2px}

/* ── TOPIC ROW ── */
.topic-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;margin-bottom:5px;cursor:pointer;border:1px solid var(--border);transition:all .15s;background:#0a0a1a}
.topic-row.done{background:#071a0f;border-color:#22c55e30}
.topic-row:active{transform:scale(0.98)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.chk.done{border-color:var(--c,#22c55e);background:var(--c,#22c55e)}

/* ── EXAM HUB ── */
.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exam-card{background:var(--bg2);border-radius:16px;padding:14px 12px;cursor:pointer;border:1px solid var(--border);position:relative;overflow:hidden;transition:all .2s}
.exam-card:active{transform:scale(0.96)}
.exam-card .glow{position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px}
.cat-title{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin:18px 0 8px 2px}

/* ── MISC ── */
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.divider{height:1px;background:var(--border);margin:12px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600}
.running-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.sw-display{font-size:56px;font-weight:900;font-family:'Courier New',monospace;letter-spacing:3px;text-align:center}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:#000000cc;z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--bg2);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}

/* ── INPUT ── */
input[type=text],input[type=number],input[type=date],textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:11px 13px;color:#e2e8f0;font-size:14px;width:100%;outline:none;transition:border .15s}
input:focus,textarea:focus{border-color:#4361ee}
textarea{resize:none;line-height:1.5}
select{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;color:#e2e8f0;font-size:13px;width:100%;outline:none}
.input-label{font-size:11px;color:#64748b;margin-bottom:5px;font-weight:600}

/* ── HEATMAP ── */
.heatmap{display:flex;gap:3px;flex-wrap:wrap}
.heatmap-cell{width:14px;height:14px;border-radius:3px;cursor:default;transition:background .3s}

/* ── DIFFICULTY CHIPS ── */
.diff-chip{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid transparent}

/* ── TOAST ── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid #4361ee44;padding:10px 18px;border-radius:12px;font-size:13px;color:#e2e8f0;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>

  const t=topic.toLowerCase();

  if(VHEAVY.some(k=>t.includes(k)))return 10;
  if(HEAVY.some(k=>t.includes(k)))return 7;
  return{upsc_cse:5,jee:5,neet:4.5,pg_neet:6,ibps_po:4,ssc_cgl:3.5,rrb_ntpc:3}[eid]||3.5;
}

// DOM builder
function el(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(k==='style')Object.assign(e.style,v);
    else if(k==='cls')e.className=v;
    else if(k[0]==='$')e.addEventListener(k.slice(1),v);
    else e.setAttribute(k,v);
  }
  if(kids!=null)(Array.isArray(kids)?kids:[kids]).forEach(c=>{
    if(c==null||c===false)return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}
const bar=(p,c,h=6)=>el('div',{cls:'bar-track',style:{height:h+'px'}},[el('div',{cls:'bar-fill',style:{width:Math.min(100,p)+'%',height:'100%',background:`linear-gradient(90deg,${c}99,${c})`}})]);
function sbox(c,lbl,val,sub){
  const b=el('div',{cls:'stat',style:{background:c+'15',border:`1px solid ${c}25`}});
  b.append(el('div',{cls:'stat-val',style:{color:c}},String(val)));

}
function btn(lbl,c,ghost,fn,full){
  const b=el('button',{cls:full?'btn-primary':(ghost?'btn-ghost':'btn-outline'),style:full?{'--c':c,'--c2':c}:{'--c':c}},lbl);
  if(full)b.style.background=`linear-gradient(135deg,${c},${c}cc)`;
  if(fn)b.addEventListener('click',fn);

}
function cSVG(p,c,sz=72){
  const r=(sz-8)/2,ci=2*Math.PI*r,ds=ci*p/100;
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',sz);s.setAttribute('height',sz);s.style.flexShrink='0';
  const mk=(st,sd)=>{const cc=document.createElementNS('http://www.w3.org/2000/svg','circle');cc.setAttribute('cx',sz/2);cc.setAttribute('cy',sz/2);cc.setAttribute('r',r);cc.setAttribute('fill','none');cc.setAttribute('stroke',st);cc.setAttribute('stroke-width','8');if(sd){cc.setAttribute('stroke-dasharray',sd);cc.setAttribute('stroke-linecap','round');cc.setAttribute('transform',`rotate(-90 ${sz/2} ${sz/2})`)}return cc};
  s.appendChild(mk('var(--border)'));s.appendChild(mk(c,`${ds} ${ci}`));
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',sz/2);t.setAttribute('y',sz/2+1);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');
  t.style.fill=c;t.style.fontSize=sz*0.2+'px';t.style.fontWeight='800';t.style.fontFamily='monospace';
  t.textContent=p+'%';s.appendChild(t);return s;
}
function chkSVG(){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width','12');s.setAttribute('height','12');s.setAttribute('viewBox','0 0 12 12');
  const p=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  p.setAttribute('points','1.5,6 5,9.5 10.5,2.5');p.setAttribute('stroke','white');p.setAttribute('stroke-width','2.5');p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
  s.appendChild(p);return s;
}
function modal(content){

// SYLLABUS STATE (topic-tick based)
// ══════════════════════════════════════════════
function syllState(def){
  const eid=CID,cfg=ETC[eid];const keys=Object.keys(def.syllabus);
  let totH=0,doneH=0,remH=0,totT=0,doneT=0;
  const tiers=[];
  keys.forEach((tk,ti)=>{
    const tier=def.syllabus[tk];
    const tcfg=cfg?.tiers[ti];const rv=tcfg?.r||1;
    let tt=0,td=0,tr=0,tc=0,tdc=0;
    Object.entries(tier.sections).forEach(([sk,sec])=>{
      sec.topics.forEach(topic=>{
        const key=sk+'||'+topic;const done=!!DB.progress[key];
        const h=Math.round(tHrs(topic,eid)*rv*10)/10;
        tt+=h;tc++;
        if(done){td+=h;tdc++;}else tr+=h;
      });
    });
    tt=Math.round(tt);td=Math.round(td);tr=Math.round(tr);
    tiers.push({name:tk,total:tt,done:td,remain:tr,topics:tc,doneTopics:tdc,color:tier.color,revNote:tcfg?.note||''});
    totH+=tt;doneH+=td;remH+=tr;totT+=tc;doneT+=tdc;
  });
  return{total:Math.round(totH),done:Math.round(doneH),remain:Math.round(remH),
    totalT:totT,doneT,remainT:totT-doneT,tiers,
    diff:cfg?.diff||'',totalNote:cfg?.total||''};
}

// study average
function studyAvg(){
  const td=TM.dayData||{};
  const days=Object.keys(td).filter(dk=>(td[dk]?.sw||0)/3600+(td[dk]?.mn||0)>0);
  const total=days.reduce((a,dk)=>a+(td[dk]?.sw||0)/3600+(td[dk]?.mn||0),0);
  return{avg:days.length>0?total/days.length:0,total,days:days.length};
}

function calcStreak(){
  const td=TM.dayData||{};const today=tdKey();
  const th=(td[today]?.sw||0)/3600+(td[today]?.mn||0);
  let streak=0;const cd=new Date();
  if(th<2)cd.setDate(cd.getDate()-1);
  for(let i=0;i<365;i++){
    const dk=`${cd.getFullYear()}-${String(cd.getMonth()+1).padStart(2,'0')}-${String(cd.getDate()).padStart(2,'0')}`;
    if((td[dk]?.sw||0)/3600+(td[dk]?.mn||0)>=2){streak++;cd.setDate(cd.getDate()-1);}else break;
  }
  return streak;
}

function examProgress(id){
  const d=lDB(id),def=EDATA[id];
  if(!def||!d.progress)return{p:0,done:0,total:0};
  let done=0,total=0;
  Object.values(def.syllabus).forEach(tier=>Object.entries(tier.sections).forEach(([sk,sec])=>{
    total+=sec.topics.length;sec.topics.forEach(t=>{if(d.progress[sk+'||'+t])done++;});
  }));
  return{p:pct(done,total),done,total};
}

function getWeakTopics(){
  if(!DB.extMocks||!DB.extMocks.length)return[];
  const subMocks=DB.extMocks.filter(m=>m.subjects);
  if(!subMocks.length)return[];
  const SUBJS=['Reasoning','Quantitative Aptitude','English','General Awareness','Computer Knowledge'];
  return SUBJS.map(subj=>{
    const rel=subMocks.filter(m=>m.subjects[subj]?.max>0);
    if(!rel.length)return null;
    const avg=Math.round(rel.reduce((a,m)=>a+Math.round((m.subjects[subj].obtained||0)/m.subjects[subj].max*100),0)/rel.length);
    return{subject:subj,avg};
  }).filter(x=>x&&x.avg<60).sort((a,b)=>a.avg-b.avg);
}

function getDueRevision(){
  const today=new Date();const due=[];
  const rev=DB.revisionDue||{};
  Object.entries(rev).forEach(([key,dateStr])=>{
    const tickDate=new Date(dateStr);
    const days=Math.floor((today-tickDate)/86400000);
    if(days>=15){
      const parts=key.split('||');
      due.push({topic:parts[parts.length-1],key,days});
    }
  });
  return due.sort((a,b)=>b.days-a.days);
}

function getDailyQs(pool){
  const day=Math.floor(Date.now()/86400000);
  const seed=day%Math.max(1,pool.length-9);
  const sh=[...pool];
  for(let i=sh.length-1;i>0;i--){const j=(seed*9301+49297+i*233)%sh.length;[sh[i],sh[j]]=[sh[j],sh[i]];}
  return sh.slice(0,Math.min(10,sh.length));
}
function buildDailyTests(){
  const def=EDATA[CID];if(!def?.questions)return[];
  return Object.entries(def.questions).map(([subj,pool])=>({
    id:'d_'+subj.toLowerCase().replace(/\s/g,'_'),
    title:subj,color:def.color,
    questions:getDailyQs(pool).map(q=>({q:q.q,options:q.ops,answer:q.a}))
  }));
}

function renderMockAnalysis(pg){
  if(!DB.extMocks?.length){pg.append(el('div',{cls:'card',style:{textAlign:'center',padding:'24px',color:'var(--text3)',borderColor:'var(--border)'}},'Add mock tests to see analysis'));return;}
  const mocks=DB.extMocks.filter(m=>(m.maxMarks||0)>0).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!mocks.length)return;
  const scores=mocks.map(m=>({name:m.name,date:m.date,p:Math.round((m.obtained||0)/(m.maxMarks||1)*100)}));
  const avg=Math.round(scores.reduce((a,s)=>a+s.p,0)/scores.length);
  const best=scores.reduce((a,s)=>s.p>a.p?s:a,scores[0]);
  const trend=scores.length>1?scores[scores.length-1].p-scores[0].p:0;
  const tc=trend>0?'#22c55e':trend<0?'#e63946':'#f97316';

  const oc=el('div',{cls:'card',style:{borderColor:'var(--border)',marginBottom:'12px'}});
  oc.append(el('div',{cls:'h3',style:{color:'var(--text2)',marginBottom:'10px'}},'Overall Performance'));
  const og=el('div',{cls:'grid2',style:{marginBottom:'12px',gap:'8px'}});
  og.append(sbox('#4361ee','Attempts',mocks.length,'mocks'));
  og.append(sbox(tc,'Trend',(trend>=0?'+':'')+trend+'%',trend>0?'Improving ✅':'Dropping ⚠️'));
  og.append(sbox('#f59e0b','Best',best.p+'%',best.name.slice(0,12)));
  og.append(sbox('#a855f7','Average',avg+'%','all mocks'));
  oc.append(og);
  oc.append(el('div',{cls:'caption',style:{marginBottom:'8px'}},'Score timeline:'));
  scores.forEach(sc2=>{
    const col=sc2.p>=70?'#22c55e':sc2.p>=50?'#f97316':'#e63946';
    const r=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px'}});
    r.append(el('span',{cls:'caption',style:{flexShrink:'0',minWidth:'44px'}},new Date(sc2.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})));
    r.append(el('div',{style:{flex:'1'}},[bar(sc2.p,col,6)]));
    r.append(el('span',{style:{fontSize:'12px',fontWeight:'700',color:col,flexShrink:'0',minWidth:'32px',textAlign:'right'}},sc2.p+'%'));
    oc.append(r);
  });
  pg.append(oc);

  const hasSub=mocks.some(m=>m.subjects);
  if(hasSub){
    const SUBJS=['Reasoning','Quantitative Aptitude','English','General Awareness','Computer Knowledge'];
    const sc3=el('div',{cls:'card',style:{borderColor:'#e6394625',marginBottom:'12px'}});
    sc3.append(el('div',{cls:'h3',style:{color:'#e63946',marginBottom:'10px'}},'Subject-wise Analysis'));
    const subMocks=mocks.filter(m=>m.subjects);
    const subAvgs=[];
    SUBJS.forEach(subj=>{
      const rel=subMocks.filter(m=>m.subjects[subj]?.max>0);
      if(!rel.length)return;
      const ap=Math.round(rel.reduce((a,m)=>a+Math.round((m.subjects[subj].obtained||0)/m.subjects[subj].max*100),0)/rel.length);
      subAvgs.push({subj,ap});
      const sc4=ap>=70?'#22c55e':ap>=50?'#f97316':'#e63946';
      const sr=el('div',{style:{marginBottom:'10px'}});
      const rh=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}});
      rh.append(el('span',{cls:'body'},subj));
      rh.append(el('span',{style:{fontSize:'13px',fontWeight:'700',color:sc4}},ap+'% '+(ap>=70?'✅':ap>=50?'⚡':'🚨')));
      sr.append(rh);sr.append(bar(ap,sc4,6));sc3.append(sr);
    });
    if(subAvgs.length>0){
      const weakest=subAvgs.sort((a,b)=>a.ap-b.ap)[0];
      const wBox=el('div',{style:{background:'#e6394612',border:'1px solid #e6394625',borderRadius:'10px',padding:'12px',marginTop:'8px'}});
      wBox.append(el('div',{style:{fontSize:'12px',fontWeight:'700',color:'#e63946',marginBottom:'4px'}},'📉 Weakest Subject'));
      wBox.append(el('div',{cls:'body',style:{color:'#fca5a5'}},'"'+weakest.subj+'" (avg '+weakest.ap+'%) — spend more time here before next mock'));
      sc3.append(wBox);
    }
    pg.append(sc3);
  }
}

    allBtn.append(btn('✗ Clear All','#e63946',true,()=>{sec.topics.forEach(t=>{delete DB.progress[trackerSec+'||'+t];delete DB.revisionDue[trackerSec+'||'+t]});sDB(CID,DB);document.querySelector('.modal-overlay').remove();showTracker()}));
    cont.append(allBtn);

      tInfo.append(el('span',{style:{fontSize:'13px',color:done?'#86efac':'#e2e8f0',textDecoration:done?'line-through':'none'}},topic));
      // difficulty chips
      if(done){

        [['Easy','#22c55e'],['Medium','#f97316'],['Hard','#e63946']].forEach(([d3,col])=>{
          const c2=el('button',{cls:'diff-chip',style:{background:diff===d3?col:col+'15',color:diff===d3?'#fff':col,border:`1px solid ${col}`,fontSize:'10px',padding:'2px 7px',borderRadius:'6px',cursor:'pointer'}},d3);
          c2.addEventListener('click',(e)=>{e.stopPropagation();DB.difficulty[key]=d3;sDB(CID,DB);document.querySelector('.modal-overlay').remove();showTracker()});
          dc.append(c2);
        });
        tInfo.append(dc);
      }
      row.append(tInfo);
      // note icon
      const nb=el('button',{style:{background:'transparent',border:'none',color:DB.notes[key]?'#f59e0b':'var(--border2)',fontSize:'16px',cursor:'pointer',padding:'4px',flexShrink:'0'}},'📝');
      nb.addEventListener('click',(e)=>{e.stopPropagation();document.querySelector('.modal-overlay').remove();showTopicNote(key,topic)});
      row.append(nb);

      });
      cont.append(row);
    });

  modal(cont);
}

// ── STUDY PLANNER ──
function showPlanner(){
  const def=EDATA[CID];const c=def.color;const cont=el('div');
  cont.append(el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}),[
    el('div',{cls:'h2'},'📅 Study Planner'),
    el('button',{cls:'btn-icon',style:{fontSize:'16px'},'$click':()=>document.querySelector('.modal-overlay')?.remove()},'×')
  ]);
  const dl=TM.examDate?Math.max(0,Math.ceil((new Date(TM.examDate)-new Date(new Date().toDateString()))/86400000)):null;
  const target=TM.targetHrs||6;
  if(!dl){
    cont.append(el('div',{style:{textAlign:'center',padding:'20px'}},[
      el('div',{style:{fontSize:'36px',marginBottom:'8px'}},'📅'),
      el('div',{cls:'body muted',style:{marginBottom:'12px'}},'Set your exam date first'),
      btn('Set Exam Date','#4361ee',false,()=>{document.querySelector('.modal-overlay')?.remove();setTab('study')},true)
    ]));
    modal(cont);return;
  }
  // get remaining topics by section
  const pendingBySec=[];
  Object.entries(def.syllabus).forEach(([tierKey,tier])=>{
    Object.entries(tier.sections).forEach(([sk,sec])=>{
      const pending=sec.topics.filter(t=>!DB.progress[sk+'||'+t]);
      if(pending.length>0)pendingBySec.push({tierKey,sk,sec,pending,color:sec.color});
    });
  });
  const totalPending=pendingBySec.reduce((a,s)=>a+s.pending.length,0);
  const info=el('div',{cls:'card-sm',style:{borderColor:c+'25',marginBottom:'14px',display:'flex',gap:'10px',alignItems:'center'}});
  info.append(el('div',{style:{flex:'1'}},[
    el('div',{cls:'body',style:{color:'var(--text)',marginBottom:'2px'}},dl+' days left · '+totalPending+' topics pending'),
    el('div',{cls:'caption'},'Daily target: '+target+'h · Approx '+Math.ceil(target/2)+' topics/day')
  ]));
  cont.append(info);
  // generate plan: group topics into days
  const topicsPerDay=Math.max(1,Math.ceil(target/3));
  const allPending=pendingBySec.flatMap(s=>s.pending.map(t=>({topic:t,section:s.sk,color:s.color,hrs:Math.round(tHrs(t,CID)*((ETC[CID]?.tiers[0]?.r)||1)*10)/10})));
  const days=[];let dayTopics=[],dayHrs=0,dayIdx=0;
  allPending.forEach(t=>{
    dayTopics.push(t);dayHrs+=t.hrs;
    if(dayHrs>=target||dayTopics.length>=topicsPerDay){days.push({topics:[...dayTopics],hrs:dayHrs});dayTopics=[];dayHrs=0;dayIdx++;}
  });
  if(dayTopics.length>0)days.push({topics:dayTopics,hrs:dayHrs});
  const totalPlanDays=days.length;
  cont.append(el('div',{cls:'caption',style:{marginBottom:'10px'}},`Plan: ${totalPlanDays} days needed · Exam: ${dl} days away · ${dl>=totalPlanDays?'✅ Completable':'⚠️ Increase daily hours'}`));
  // show today's plan
  const todayPlan=days[planDay];
  if(todayPlan){
    const pc=el('div',{style:{display:'flex',gap:'8px',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}});
    const prevB=btn('←','#64748b',true,()=>{if(planDay>0){planDay--;document.querySelector('.modal-overlay').remove();showPlanner();}});
    prevB.disabled=planDay===0;
    const nextB=btn('→','#64748b',true,()=>{if(planDay<days.length-1){planDay++;document.querySelector('.modal-overlay').remove();showPlanner();}});
    nextB.disabled=planDay===days.length-1;
    pc.append(prevB,el('div',{style:{textAlign:'center'}},[el('div',{cls:'h3',style:{color:c}},'Day '+(planDay+1)+' of '+totalPlanDays),el('div',{cls:'caption'},'~'+todayPlan.hrs.toFixed(1)+'h · '+todayPlan.topics.length+' topics')]),nextB);
    cont.append(pc);
    todayPlan.topics.forEach(t=>{
      const r=el('div',{style:{display:'flex',gap:'10px',alignItems:'center',padding:'9px 12px',borderRadius:'10px',marginBottom:'6px',background:'var(--bg3)',border:`1px solid ${t.color}25`}});
      const dot=el('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:t.color,flexShrink:'0'}});
      r.append(dot,el('div',{style:{flex:'1'}},[
        el('div',{cls:'body'},t.topic),
        el('div',{cls:'caption'},t.section+' · ~'+t.hrs+'h')
      ]));
      cont.append(r);
    });
  }
  modal(cont);
}

      card.append(rh);
      card.append(el('div',{cls:'bar-track',style:{height:'6px',marginBottom:'6px'}},[el('div',{cls:'bar-fill',style:{width:w.avg+'%',background:col,height:'100%'}})]));
      const tip=w.avg<40?'🚨 Critical — needs immediate focus':'⚡ Moderate — spend extra time here';
      card.append(el('div',{cls:'caption',style:{color:col}},tip));
      cont.append(card);
    });
    cont.append(el('div',{style:{background:'#4361ee12',border:'1px solid #4361ee25',borderRadius:'10px',padding:'12px',marginTop:'8px'}},[
      el('div',{cls:'h3',style:{color:'#4361ee',marginBottom:'4px'}},'💡 Tip'),
      el('div',{cls:'caption'},'Go to ✅ Tracker → find these subjects → mark topics as Hard → they will show up in your Study Planner with extra time allocated.')
    ]));
  }
  modal(cont);
}

  renderHub();
}
</script>
