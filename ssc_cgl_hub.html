<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{background:#070714;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select{font-family:inherit}
::-webkit-scrollbar{display:none}
.card{background:#0d0d20;border-radius:12px;padding:14px;margin-bottom:10px}
.bar-bg{background:#1a1a3e;border-radius:99px;overflow:hidden}
.stat-box{border-radius:10px;padding:10px 8px;text-align:center}
.topic-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:4px;cursor:pointer;border:1px solid #1e1e3a;transition:all .15s}
.topic-row.done{background:#0d2d1a;border-color:#22c55e33}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid #3a3a5a;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.checkbox.done{border-color:var(--c);background:var(--c)}
.btn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--c,#4361ee);background:var(--c,#4361ee)22;color:var(--c,#4361ee)}
.btn.outline{background:transparent}
.tab-bar{display:flex;overflow-x:auto;border-bottom:1px solid #1e1e40;padding:0 4px;scrollbar-width:none}
.tab-btn{padding:9px 10px;background:transparent;border:none;border-bottom:2px solid transparent;color:#4a5568;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0}
.tab-btn.active{color:#7b9fff;border-bottom-color:#4361ee;font-weight:700}
.strat-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #1a1a3e;font-size:13px;line-height:1.5}
.f-row{background:#070714;border:1px solid #1e1e3a;border-radius:8px;padding:9px 13px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:5px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.history-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1a1a3e}
input[type=date],input[type=number],input[type=text]{background:#1a1a3e;border:1px solid #2a2a4a;border-radius:8px;padding:9px 12px;color:#e2e8f0;font-size:13px;width:100%}
.running-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.exam-card{background:#0d0d20;border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;border:1px solid #1e1e3a;position:relative;overflow:hidden}
.exam-card:active{transform:scale(0.97)}
.hub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;margin:16px 0 8px;padding:0 2px}
</style>
</head>

const pct=(d,t)=>t===0?0:Math.round(d/t*100);
const tdKey=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fHMS=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`};
const fHM=h=>{const hh=Math.floor(h),mm=Math.round((h-hh)*60);if(hh===0)return mm+'m';if(mm===0)return hh+'h';return hh+'h '+mm+'m'};
const $=id=>document.getElementById(id);

function el(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(k==='style')Object.assign(e.style,v);
    else if(k==='cls')e.className=v;
    else if(k[0]==='$')e.addEventListener(k.slice(1),v);
    else e.setAttribute(k,v);
  }
  if(kids!=null)(Array.isArray(kids)?kids:[kids]).forEach(c=>{
    if(c==null||c===false)return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}
const barEl=(p,c,h=8)=>el('div',{cls:'bar-bg',style:{height:h+'px'}},[el('div',{style:{width:p+'%',height:'100%',borderRadius:'99px',background:`linear-gradient(90deg,${c}88,${c})`,transition:'width .6s'}})]);
function sbEl(c,l,v,s){
  const b=el('div',{cls:'stat-box',style:{background:c+'12',border:`1px solid ${c}30`}});

  if(s)b.append(el('div',{style:{fontSize:'10px',color:'#64748b',marginTop:'2px'}},s));
  return b;
}

function circSVG(p,c,sz=80){
  const r=(sz-8)/2,ci=2*Math.PI*r,ds=ci*p/100;
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',sz);s.setAttribute('height',sz);s.style.flexShrink='0';
  const mk=(cx,cy,rr,st,sd,sl)=>{const cc=document.createElementNS('http://www.w3.org/2000/svg','circle');cc.setAttribute('cx',cx);cc.setAttribute('cy',cy);cc.setAttribute('r',rr);cc.setAttribute('fill','none');cc.setAttribute('stroke',st);cc.setAttribute('stroke-width','8');if(sd){cc.setAttribute('stroke-dasharray',sd);cc.setAttribute('stroke-linecap','round');cc.setAttribute('transform',`rotate(-90 ${cx} ${cy})`)}return cc};
  s.appendChild(mk(sz/2,sz/2,r,'#1a1a3e'));
  s.appendChild(mk(sz/2,sz/2,r,c,`${ds} ${ci}`,true));
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',sz/2);t.setAttribute('y',sz/2+1);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');
  t.style.fill=c;t.style.fontSize=sz*0.2+'px';t.style.fontWeight='800';t.style.fontFamily='monospace';
  t.textContent=p+'%';s.appendChild(t);return s;
}
function chkSVG(){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width','12');s.setAttribute('height','12');s.setAttribute('viewBox','0 0 12 12');

  p.setAttribute('points','1.5,6 5,9.5 10.5,2.5');p.setAttribute('stroke','white');p.setAttribute('stroke-width','2');p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
  s.appendChild(p);return s;
}

// ═══════════════════════════ ROUTING ═══════════════════════════
function goHub(){clearInterval(swIv);swIv=null;swOn=false;CID=null;PAGE='hub';render()}
function openExam(id){
  const def=EDATA[id];
  if(!def){showCS();return}
  CID=id;DB=loadDB(id);TM=loadTM(id);
  if(!DB.progress)DB.progress={};
  if(!DB.mockScores)DB.mockScores={};
  if(!DB.extMocks)DB.extMocks=[];
  if(!TM.dayData)TM.dayData={};
  clearInterval(swIv);swOn=false;swEl=0;swBs=0;swSt=null;
  if(TM.swOn&&TM.swSt){
    swSt=TM.swSt;swBs=TM.swBs||0;
    swEl=swBs+Math.floor((Date.now()-swSt)/1000);swOn=true;
    swIv=setInterval(()=>{
      swEl=swBs+Math.floor((Date.now()-swSt)/1000);
      const d=$('sw-disp');if(d)d.textContent=fHMS(swEl);
      const tk=tdKey();TM.dayData[tk]=TM.dayData[tk]||{sw:0,mn:0};
      TM.dayData[tk].sw=swEl;TM.swBs=swEl;saveTM(CID,TM);
    },1000);
  }
  ETAB='dashboard';TRTIER=Object.keys(def.syllabus)[0];TRSEC=null;
  MTAB='daily';MSEL=null;MSUB=false;GTAB='overview';HPAG=0;SVEW='combined';EXTVW='list';
  PAGE='exam';render();
}
function showCS(){
  const ov=el('div',{style:{position:'fixed',inset:'0',background:'#000c',zIndex:'9999',display:'flex',alignItems:'center',justifyContent:'center'}});
  const bx=el('div',{style:{background:'#0d0d20',border:'1px solid #1e1e40',borderRadius:'18px',padding:'28px',width:'80%',maxWidth:'340px',textAlign:'center'}});
  bx.append(el('div',{style:{fontSize:'48px',marginBottom:'12px'}},'🚧'));
  bx.append(el('div',{style:{fontSize:'18px',fontWeight:'800',color:'#e2e8f0',marginBottom:'8px'}},'Coming Soon!'));
  bx.append(el('div',{style:{fontSize:'13px',color:'#64748b',marginBottom:'20px'}},'Full content for this exam is being prepared. Stay tuned!'));
  bx.append(btnEl('Go Back','#4361ee',false,()=>ov.remove()));
  ov.append(bx);ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
  document.body.appendChild(ov);
}
function setETab(t){ETAB=t;TRSEC=null;HPAG=0;rerender()}
function rerender(){const c=$('econtent');if(c){c.innerHTML='';renderEContent(c)}}

// ═══════════════════════════ RENDER ROOT ═══════════════════════════
function render(){
  const root=$('root');root.innerHTML='';
  if(PAGE==='hub')renderHub(root);
  else renderExam(root);
}

function getExProg(id){
  const d=loadDB(id),def=EDATA[id];
  if(!def||!d.progress)return{p:0,done:0,tot:0};
  let done=0,tot=0;
  Object.values(def.syllabus).forEach(tier=>Object.entries(tier.sections).forEach(([sk,sec])=>{
    tot+=sec.topics.length;sec.topics.forEach(t=>{if(d.progress[sk+'||'+t])done++;});
  }));
  return{p:pct(done,tot),done,tot};
}
function renderHub(root){
  const hdr=el('div',{style:{background:'linear-gradient(135deg,#0f0f2a,#070714)',borderBottom:'1px solid #1e1e40',padding:'20px 16px 16px',position:'sticky',top:'0',zIndex:'100'}});

  const total=REGISTRY.reduce((a,c)=>a+c.exams.length,0);

function calcStreak(){
  const td=TM.dayData||{};const today=tdKey();
  const th=(td[today]?.sw||0)/3600+(td[today]?.mn||0);
  let streak=0;const cd=new Date();
  if(th<2)cd.setDate(cd.getDate()-1);
  for(let i=0;i<365;i++){
    const dk=`${cd.getFullYear()}-${String(cd.getMonth()+1).padStart(2,'0')}-${String(cd.getDate()).padStart(2,'0')}`;
    const hh=(td[dk]?.sw||0)/3600+(td[dk]?.mn||0);
    if(hh>=2){streak++;cd.setDate(cd.getDate()-1);}else break;
  }
  return streak;
}

// Topic depth classification
const HEAVY_TOPICS = ["calculus","integration","differentiation","organic chemistry","coordination","thermodynamics","electrostatics","mechanics","rotational","modern physics","genetics","ecology","international relations","disaster management","ethics","essay","answer writing","optional","pathology","pharmacology","microbiology","surgery","medicine","anatomy","physiology","biochemistry"];
const VHEAVY_TOPICS = ["mains","optional subject","clinical","comprehensive","complex","caselet","critical thinking"];
const LIGHT_TOPICS = ["sports","awards","books","authors","important days","static gk","honours","schemes","abbreviations","computer memory","ms word","ms excel","ms powerpoint"];

function getTopicDepthHrs(topicName,examId){
  const t=topicName.toLowerCase();
  if(LIGHT_TOPICS.some(k=>t.includes(k))) return 2;
  if(VHEAVY_TOPICS.some(k=>t.includes(k))) return 10;
  if(HEAVY_TOPICS.some(k=>t.includes(k))) return 7;
  const defaults={upsc_cse:5,jee:5,neet:4.5,pg_neet:6,ibps_po:4,ssc_cgl:3.5,rrb_ntpc:3};
  return defaults[examId]||3.5;
}

// Returns per-topic hours: completed topics hours subtracted from remaining
function calcSyllabusState(def){
  const examId=CID;
  const cfg=EXAM_TIME_CONFIG[examId];
  const keys=Object.keys(def.syllabus);
  let totalHrs=0,doneHrs=0,remainHrs=0,totalTopics=0,doneTopics=0;
  const tierBreakdown=[];
  keys.forEach((tierKey,ti)=>{
    const tier=def.syllabus[tierKey];
    const tcfg=cfg&&cfg.tierConfig[ti]?cfg.tierConfig[ti]:null;
    const revMult=tcfg?tcfg.revisions:1;
    let tTotal=0,tDone=0,tRemain=0,tTopics=0,tDoneTopics=0;
    Object.entries(tier.sections).forEach(([sk,sec])=>{
      sec.topics.forEach(topic=>{
        const key=sk+'||'+topic;
        const done=!!DB.progress[key];
        const hrs=Math.round(getTopicDepthHrs(topic,examId)*revMult*10)/10;
        tTotal+=hrs;tTopics++;
        if(done){tDone+=hrs;tDoneTopics++;}
        else tRemain+=hrs;
      });
    });
    // add practice hours for this tier
    const pracFrac=tcfg?(cfg.extraPractice||0)/keys.length:0;
    const pracDone=tTopics>0?(tDoneTopics/tTopics)*pracFrac:0;
    tTotal=Math.round(tTotal+pracFrac);
    tDone=Math.round(tDone+pracDone);
    tRemain=Math.round(tRemain+(pracFrac-pracDone));
    tierBreakdown.push({name:tierKey,total:tTotal,done:tDone,remain:tRemain,
      topics:tTopics,doneTopics:tDoneTopics,color:tier.color,
      revMult,revNote:tcfg?tcfg.revisionNote:''});
    totalHrs+=tTotal;doneHrs+=tDone;remainHrs+=tRemain;
    totalTopics+=tTopics;doneTopics+=tDoneTopics;
  });
  return{totalHrs:Math.round(totalHrs),doneHrs:Math.round(doneHrs),remainHrs:Math.round(remainHrs),
    totalTopics,doneTopics,remainTopics:totalTopics-doneTopics,tierBreakdown,
    diffNote:cfg?.difficultyNote||'',totalNote:cfg?.totalNote||'',practiceNote:cfg?.extraNote||''};
}

function getDailyQs(pool){
  const day=Math.floor(Date.now()/86400000);
  const seed=day%Math.max(1,pool.length-9);
  const sh=[...pool];
  for(let i=sh.length-1;i>0;i--){const j=(seed*9301+49297+i*233)%sh.length;[sh[i],sh[j]]=[sh[j],sh[i]];}
  return sh.slice(0,Math.min(10,sh.length));
}
function buildDailyTests(){
  const def=EDATA[CID];if(!def?.questions)return[];
  return Object.entries(def.questions).map(([subj,pool])=>({
    id:'d_'+subj.toLowerCase().replace(/\s/g,'_'),
    title:'Daily — '+subj,color:def.color,
    questions:getDailyQs(pool).map(q=>({q:q.q,options:q.ops,answer:q.a}))
  }));
}

  form.append(el('div',{style:{fontSize:'12px',color:'#64748b',margin:'10px 0 4px'}},'Date'));
  const dateIn=el('input',{type:'date'});dateIn.value=tdKey();form.append(dateIn);

  // mode toggle
  form.append(el('div',{style:{fontSize:'12px',color:'#64748b',margin:'12px 0 6px'}},'Enter marks as:'));
  let mode='full';
  const modeRow=el('div',{style:{display:'flex',gap:'8px',marginBottom:'12px'}});
  const fb=el('button',{style:{padding:'7px 14px',borderRadius:'8px',fontSize:'12px',fontWeight:'700',cursor:'pointer',border:'1px solid #4361ee',background:'#4361ee',color:'#fff'}},'Full Total');
  const sb2=el('button',{style:{padding:'7px 14px',borderRadius:'8px',fontSize:'12px',fontWeight:'700',cursor:'pointer',border:'1px solid #a855f7',background:'#a855f722',color:'#a855f7'}},'Subject-wise');
  modeRow.append(fb,sb2);form.append(modeRow);

  // full fields
  const fullF=el('div');
  const fg=el('div',{cls:'grid2',style:{marginBottom:'8px'}});
  const oIn=el('input',{type:'number',placeholder:'Marks obtained'});
  const mIn=el('input',{type:'number',placeholder:'Total marks'});
  const ol2=el('div');ol2.append(el('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'4px'}},'Obtained'));ol2.append(oIn);
  const ml2=el('div');ml2.append(el('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'4px'}},'Total Marks'));ml2.append(mIn);
  fg.append(ol2,ml2);fullF.append(fg);form.append(fullF);

  // subject fields
  const SUBJECTS=['Reasoning','Quantitative Aptitude','English','General Awareness','Computer Knowledge'];
  const SCOLS=['#e63946','#e9c46a','#457b9d','#2a9d8f','#f4a261'];
  const subjF=el('div',{style:{display:'none'}});
  const subjInputs={};
  SUBJECTS.forEach((subj,si)=>{
    const sr=el('div',{style:{marginBottom:'10px'}});
    sr.append(el('div',{style:{fontSize:'12px',color:SCOLS[si],fontWeight:'700',marginBottom:'4px'}},subj));
    const sg2=el('div',{cls:'grid2'});
    const oi=el('input',{type:'number',placeholder:'Obtained'});
    const mi=el('input',{type:'number',placeholder:'Max (0=skip)'});
    const ol3=el('div');ol3.append(el('div',{style:{fontSize:'10px',color:'#64748b',marginBottom:'3px'}},'Obtained'));ol3.append(oi);
    const ml3=el('div');ml3.append(el('div',{style:{fontSize:'10px',color:'#64748b',marginBottom:'3px'}},'Max Marks'));ml3.append(mi);
    sg2.append(ol3,ml3);sr.append(sg2);subjF.append(sr);
    subjInputs[subj]={o:oi,m:mi};
  });
  form.append(subjF);

  fb.addEventListener('click',()=>{mode='full';fullF.style.display='block';subjF.style.display='none';fb.style.background='#4361ee';fb.style.color='#fff';sb2.style.background='#a855f722';sb2.style.color='#a855f7'});
  sb2.addEventListener('click',()=>{mode='subject';subjF.style.display='block';fullF.style.display='none';sb2.style.background='#a855f7';sb2.style.color='#fff';fb.style.background='#4361ee22';fb.style.color='#4361ee'});

  const saveBtn=btnEl('Save Mock','#22c55e',false,()=>{
    const name=nameIn.value.trim();if(!name){alert('Enter a name');return;}
    const entry={name,date:dateIn.value||tdKey()};
    if(mode==='full'){
      const o=parseFloat(oIn.value),mx=parseFloat(mIn.value);
      if(isNaN(o)||isNaN(mx)||mx<=0){alert('Enter valid marks');return;}
      entry.obtained=o;entry.maxMarks=mx;
    }else{
      const subjects={};
      SUBJECTS.forEach(subj=>{subjects[subj]={obtained:parseFloat(subjInputs[subj].o.value)||0,max:parseFloat(subjInputs[subj].m.value)||0}});
      const totMax=Object.values(subjects).reduce((a,s)=>a+s.max,0);
      if(totMax<=0){alert('Enter at least one subject max marks');return;}
      entry.subjects=subjects;
      entry.obtained=Object.values(subjects).reduce((a,s)=>a+(s.obtained||0),0);
      entry.maxMarks=totMax;
    }
    if(!DB.extMocks)DB.extMocks=[];
    DB.extMocks.push(entry);saveDB(CID,DB);EXTVW='list';rerender();
  });
  saveBtn.style.width='100%';saveBtn.style.padding='11px';saveBtn.style.marginTop='14px';form.append(saveBtn);
  pg.append(form);
}
function renderExtAnalysis(pg){
  if(!DB.extMocks||!DB.extMocks.length){pg.append(el('div',{cls:'card',style:{border:'1px solid #1e1e3a',padding:'20px',textAlign:'center',color:'#64748b'}},'No mocks logged yet. Add some to see analysis.'));return;}
  const mocks=DB.extMocks.filter(m=>(m.maxMarks||0)>0).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!mocks.length){pg.append(el('div',{cls:'card'},'No valid mock data.'));return;}
  const scores=mocks.map(m=>({name:m.name,date:m.date,p:Math.round((m.obtained||0)/(m.maxMarks||1)*100)}));
  const avg=Math.round(scores.reduce((a,s)=>a+s.p,0)/scores.length);
  const best=scores.reduce((a,s)=>s.p>a.p?s:a,scores[0]);
  const trend=scores.length>1?scores[scores.length-1].p-scores[0].p:0;
  const tc=trend>0?'#22c55e':trend<0?'#e63946':'#f97316';
  const oc=el('div',{cls:'card',style:{border:'1px solid #4361ee28'}});
  oc.append(el('div',{style:{fontSize:'13px',fontWeight:'800',color:'#4361ee',marginBottom:'10px'}},'📊 Mock Analysis'));
  const og=el('div',{cls:'grid2',style:{marginBottom:'10px'}});
  og.append(sbEl('#4361ee','📝 Attempts',mocks.length,'mocks'));
  og.append(sbEl(tc,'📈 Trend',(trend>=0?'+':'')+trend+'%',trend>0?'Improving ✅':'Dropping ⚠️'));
  og.append(sbEl('#f59e0b','⭐ Best',best.p+'%',best.name.slice(0,12)));
  og.append(sbEl('#a855f7','📉 Avg',avg+'%','all mocks'));
  oc.append(og);
  oc.append(el('div',{style:{fontSize:'12px',color:'#64748b',marginBottom:'6px'}},'Score timeline:'));
  scores.forEach(s=>{
    const col=s.p>=70?'#22c55e':s.p>=50?'#f97316':'#e63946';
    const sr=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'5px'}});
    sr.append(el('div',{style:{width:'7px',height:'7px',borderRadius:'50%',background:col,flexShrink:'0'}}));
    sr.append(el('span',{style:{fontSize:'11px',color:'#94a3b8',flexShrink:'0'}},new Date(s.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})));
    sr.append(el('div',{style:{flex:'1'}},[barEl(s.p,col,5)]));
    sr.append(el('span',{style:{fontSize:'12px',fontWeight:'700',color:col,flexShrink:'0'}},s.p+'%'));
    oc.append(sr);
  });
  pg.append(oc);
  // subject analysis
  const hasSub=mocks.some(m=>m.subjects);
  if(hasSub){
    const SUBJECTS=['Reasoning','Quantitative Aptitude','English','General Awareness','Computer Knowledge'];
    const SCOLS=['#e63946','#e9c46a','#457b9d','#2a9d8f','#f4a261'];
    const subMocks=mocks.filter(m=>m.subjects);
    const sc3=el('div',{cls:'card',style:{border:'1px solid #e6394628'}});
    sc3.append(el('div',{style:{fontSize:'13px',fontWeight:'800',color:'#e63946',marginBottom:'10px'}},'🎯 Subject-wise Analysis'));
    const subAvgs=[];
    SUBJECTS.forEach((subj,si)=>{
      const rel=subMocks.filter(m=>m.subjects[subj]?.max>0);
      if(!rel.length)return;
      const ap=Math.round(rel.reduce((a,m)=>a+Math.round((m.subjects[subj].obtained||0)/m.subjects[subj].max*100),0)/rel.length);
      subAvgs.push({subj,ap});
      const col=SCOLS[si];const sc4=ap>=70?'#22c55e':ap>=50?'#f97316':'#e63946';
      const status=ap>=70?'✅ Strong':ap>=50?'⚡ Moderate':'🚨 Needs Work';
      const sr=el('div',{style:{marginBottom:'10px'}});
      const shr=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'3px'}});
      shr.append(el('span',{style:{fontSize:'12px',color:col,fontWeight:'700'}},subj));
      const sr2=el('div',{style:{display:'flex',gap:'6px',alignItems:'center'}});
      sr2.append(el('span',{style:{fontSize:'11px',color:sc4,fontWeight:'700'}},status));
      sr2.append(el('span',{style:{fontSize:'12px',fontWeight:'800',color:sc4}},ap+'%'));
      shr.append(sr2);sr.append(shr);sr.append(barEl(ap,sc4,7));
      if(ap<50){const tip=el('div',{style:{fontSize:'11px',color:'#fca5a5',marginTop:'4px',padding:'4px 8px',background:'#e6394612',borderRadius:'6px'}});tip.textContent='⚠️ Focus more on '+subj+' — below 50% avg';sr.append(tip);}
      sc3.append(sr);
    });
    if(subAvgs.length>0){
      const weakest=subAvgs.sort((a,b)=>a.ap-b.ap)[0];
      const wBox=el('div',{style:{background:'#e6394612',border:'1px solid #e6394633',borderRadius:'8px',padding:'10px',marginTop:'6px'}});
      wBox.append(el('div',{style:{fontSize:'12px',fontWeight:'800',color:'#e63946',marginBottom:'4px'}},'📉 Priority Focus Area'));
      wBox.append(el('div',{style:{fontSize:'13px',color:'#fca5a5'}},`Weakest: "${weakest.subj}" (avg ${weakest.ap}%). Spend extra time here!`));
      sc3.append(wBox);
    }
    pg.append(sc3);
  }
}

// ═══════════════════════════ TIMER ═══════════════════════════
function renderTimer(pg){
  const def=EDATA[CID];const c=def.color;const today=tdKey();
  // exam date card
  const edc=el('div',{cls:'card',style:{border:'1px solid #e6394628',marginBottom:'10px'}});
  renderExamDate(edc);pg.append(edc);
  // stats
  const streak=calcStreak();const sc=streak>=7?'#f59e0b':streak>=3?'#f97316':'#4361ee';
  const allD=Object.keys(TM.dayData||{}).filter(dk=>(TM.dayData[dk]?.sw||0)/3600+(TM.dayData[dk]?.mn||0)>0);
  const totalH=allD.reduce((a,dk)=>a+(TM.dayData[dk]?.sw||0)/3600+(TM.dayData[dk]?.mn||0),0);
  const avgH=allD.length>0?totalH/allD.length:0;
  const sg=el('div',{cls:'grid3',style:{marginBottom:'10px'}});
  sg.append(el('div',{cls:'stat-box',style:{background:sc+'12',border:`1px solid ${sc}30`},innerHTML:`<div style="font-size:10px;color:#64748b">🔥 Streak</div><div style="font-size:20px;font-weight:900;color:${sc}">${streak} days</div>`}));
  sg.append(sbEl('#a855f7','📈 Avg/day',fHM(avgH),allD.length+' days'));
  sg.append(sbEl('#2a9d8f','📚 Total',fHM(totalH),'studied'));
  pg.append(sg);
  // syllabus prediction
  pg.append(buildSyllCard(def));
  // target
  if(!TM.targetHrs)TM.targetHrs=6;
  const target=TM.targetHrs;
  const todaySW=(TM.dayData[today]?.sw||0)/3600;
  const todayMn=TM.dayData[today]?.mn||0;
  const todayTot=todaySW+todayMn;
  const todayPct=Math.min(100,todayTot/target*100);
  const tCard=el('div',{cls:'card',style:{border:`1px solid ${c}28`,marginBottom:'10px'}});
  tCard.append(el('div',{style:{fontSize:'13px',fontWeight:'700',color:'#a855f7',marginBottom:'8px'}},'🎯 Daily Target'));
  const tRow=el('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'10px'}});
  tRow.append(el('div',{style:{fontSize:'12px',color:'#94a3b8',flexShrink:'0'}},'Target (hrs/day):'));
  const tIn=el('input',{type:'number',min:'1',max:'16',step:'0.5',style:{width:'80px'}});tIn.value=target;
  tRow.append(tIn);
  tRow.append(btnEl('Set','#a855f7',false,()=>{const v=parseFloat(tIn.value);if(!isNaN(v)&&v>0){TM.targetHrs=v;saveTM(CID,TM);rerender();}}));
  tCard.append(tRow);
  const tg=el('div',{cls:'grid3',style:{marginBottom:'10px'}});
  tg.append(sbEl(c,'🎯 Target',target+'h','per day'));
  tg.append(sbEl('#f97316','✍️ Manual',fHM(todayMn),'today'));
  tg.append(sbEl(todayTot>=target?'#22c55e':'#e63946','🎯 Total',fHM(todayTot),todayTot>=target?'✅ Hit!':'Need '+fHM(Math.max(0,target-todayTot))));
  tCard.append(tg);
  const th=el('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'3px'}});
  th.append(el('span',{style:{fontSize:'11px',color:'#64748b'}},'Today vs target'));
  th.append(el('span',{style:{fontSize:'11px',color:todayPct>=100?'#22c55e':'#a855f7'}},Math.round(todayPct)+'%'));
  tCard.append(th);tCard.append(barEl(todayPct,todayPct>=100?'#22c55e':'#a855f7',7));
  pg.append(tCard);
  // stopwatch
  const swColor=swOn?'#22c55e':'#4361ee';
  const swCard=el('div',{cls:'card',style:{border:`1px solid ${swColor}28`,textAlign:'center',marginBottom:'10px'}});
  const swLbl=el('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'6px'}});
  swLbl.appendChild(document.createTextNode('⏱ Stopwatch '));
  if(swOn){const dot=el('span',{cls:'running-dot'});swLbl.append(dot);}
  swCard.append(swLbl);
  swCard.append(el('div',{id:'sw-disp',style:{fontSize:'48px',fontWeight:'900',color:swColor,fontFamily:'monospace',letterSpacing:'2px',marginBottom:'14px'}},fHMS(swOn?swEl:(TM.dayData[today]?.sw||0))));
  const swBtns=el('div',{style:{display:'flex',gap:'10px',justifyContent:'center'}});
  if(!swOn){
    const startB=btnEl('▶ Start','#22c55e',false,()=>{
      const now=Date.now();swSt=now;swOn=true;
      TM.swOn=true;TM.swSt=now;TM.swBs=swBs;saveTM(CID,TM);
      clearInterval(swIv);
      swIv=setInterval(()=>{
        swEl=swBs+Math.floor((Date.now()-swSt)/1000);
        const d=$('sw-disp');if(d)d.textContent=fHMS(swEl);
        const tk=tdKey();
        TM.dayData[tk]=TM.dayData[tk]||{sw:0,mn:0};
        TM.dayData[tk].sw=swEl;TM.swBs=swEl;saveTM(CID,TM);
      },1000);
      rerender();
    });
    startB.style.padding='10px 28px';startB.style.fontSize='14px';startB.style.fontWeight='800';startB.style.borderRadius='12px';swBtns.append(startB);
  }else{
    const pauseB=btnEl('⏸ Pause','#e63946',false,()=>{
      clearInterval(swIv);swIv=null;
      swBs=swBs+Math.floor((Date.now()-swSt)/1000);swEl=swBs;swOn=false;swSt=null;
      const tk=tdKey();
      TM.dayData[tk]=TM.dayData[tk]||{sw:0,mn:0};
      TM.dayData[tk].sw=swBs;TM.swOn=false;TM.swSt=null;TM.swBs=swBs;saveTM(CID,TM);rerender();
    });
    pauseB.style.padding='10px 28px';pauseB.style.fontSize='14px';pauseB.style.fontWeight='800';pauseB.style.borderRadius='12px';swBtns.append(pauseB);
  }
  const resetB=btnEl('↺ Reset','#64748b',true,()=>{
    if(!confirm('Reset stopwatch?'))return;
    clearInterval(swIv);swIv=null;swBs=0;swEl=0;swOn=false;swSt=null;
    const tk=tdKey();
    TM.dayData[tk]=TM.dayData[tk]||{sw:0,mn:0};TM.dayData[tk].sw=0;
    TM.swOn=false;TM.swSt=null;TM.swBs=0;saveTM(CID,TM);rerender();
  });
  resetB.style.padding='10px 16px';resetB.style.borderRadius='12px';swBtns.append(resetB);
  swCard.append(swBtns);swCard.append(el('div',{style:{fontSize:'11px',color:'#475569',marginTop:'10px'}},'Continues running even if you switch tabs'));
  pg.append(swCard);
  // manual entry
  const mc=el('div',{cls:'card',style:{border:'1px solid #f9741628',marginBottom:'10px'}});
  mc.append(el('div',{style:{fontSize:'13px',fontWeight:'700',color:'#f97316',marginBottom:'8px'}},'✍️ Log Hours Manually (Today)'));
  const mRow=el('div',{style:{display:'flex',gap:'8px',alignItems:'center'}});
  const mIn=el('input',{type:'number',min:'0.25',max:'24',step:'0.25',placeholder:'e.g. 1.5 = 1h 30min'});
  const mErr=el('div',{style:{fontSize:'11px',color:'#e63946',marginTop:'5px',display:'none'}},'Enter 0.25 to 24');
  const addB=btnEl('+ Add','#f97316',false,()=>{
    const v=parseFloat(mIn.value);if(isNaN(v)||v<=0||v>24){mErr.style.display='block';return;}
    mErr.style.display='none';
    const tk=tdKey();TM.dayData[tk]=TM.dayData[tk]||{sw:0,mn:0};
    TM.dayData[tk].mn=(TM.dayData[tk].mn||0)+v;saveTM(CID,TM);mIn.value='';rerender();
  });
  addB.style.padding='9px 16px';addB.style.fontWeight='700';
  mRow.append(mIn,addB);mc.append(mRow,mErr);
  mc.append(el('div',{style:{fontSize:'11px',color:'#64748b',marginTop:'6px'}},'0.5=30min · 1.5=1h30m · 2=2h'));
  pg.append(mc);
  // history
  const allD2=Object.keys(TM.dayData||{}).filter(dk=>(TM.dayData[dk]?.sw||0)+(TM.dayData[dk]?.mn||0)>0).sort().reverse();
  if(allD2.length>0){
    const hc=el('div',{cls:'card',style:{border:'1px solid #94a3b828'}});
    hc.append(el('div',{style:{fontSize:'13px',fontWeight:'700',color:'#94a3b8',marginBottom:'10px'}},'📅 Study History'));
    allD2.slice(HPAG*10,(HPAG+1)*10).forEach(dk=>{
      const d=TM.dayData[dk];const sw2=(d?.sw||0)/3600,mn2=d?.mn||0,tot2=sw2+mn2;
      const dateObj=new Date(dk+'T00:00:00');
      const lbl=dateObj.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
      const isT=dk===today;
      const row=el('div',{cls:'history-row'});
      const dot=el('div',{style:{width:'6px',height:'6px',borderRadius:'50%',background:tot2>=2?'#22c55e':tot2>0?'#f97316':'#4a5568',flexShrink:'0'}});
      const info=el('div',{style:{flex:'1'}});
      info.append(el('div',{style:{fontSize:'12px',color:isT?'#4361ee':'#94a3b8',fontWeight:isT?'700':'400'}},lbl+(isT?' (today)':'')));
      const parts=[];if(sw2>0)parts.push('⏱ '+fHM(sw2));if(mn2>0)parts.push('✍️ '+fHM(mn2));
      info.append(el('div',{style:{fontSize:'11px',color:'#475569'}},parts.join(' + ')));
      const tv=el('div',{style:{textAlign:'right'}});
      tv.append(el('div',{style:{fontSize:'14px',fontWeight:'800',color:tot2>=2?'#22c55e':tot2>=1?'#f97316':'#e63946'}},fHM(tot2)));
      if(tot2>=2)tv.append(el('div',{style:{fontSize:'10px',color:'#22c55e'}},'🔥 streak'));
      row.append(dot,info,tv);hc.append(row);
    });
    const totPg=Math.ceil(allD2.length/10);
    if(totPg>1){
      const pRow=el('div',{style:{display:'flex',justifyContent:'center',gap:'8px',marginTop:'10px',alignItems:'center'}});
      const pb=btnEl('← Prev','#64748b',true,()=>{HPAG--;rerender()});pb.disabled=HPAG===0;
      pRow.append(pb,el('span',{style:{fontSize:'12px',color:'#64748b',padding:'6px 0'}},'Page '+(HPAG+1)+'/'+totPg));
      const nb=btnEl('Next →','#64748b',true,()=>{HPAG++;rerender()});nb.disabled=HPAG===totPg-1;
      pRow.append(nb);hc.append(pRow);
    }
    pg.append(hc);
  }
}
function renderExamDate(card){
  card.innerHTML='';
  if(!TM.editDate){
    const row=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
    const left=el('div');
    left.append(el('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'2px'}},'📅 Exam Date'));
    if(TM.examDate){
      const dl=Math.ceil((new Date(TM.examDate)-new Date(new Date().toDateString()))/86400000);
      left.append(el('div',{style:{fontSize:'13px',fontWeight:'700',color:'#e2e8f0'}},new Date(TM.examDate).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})));
      const dlCol=dl<=30?'#e63946':dl<=90?'#f97316':'#22c55e';
      left.append(el('div',{style:{fontSize:'20px',fontWeight:'900',color:dlCol}},dl>0?dl+' days left':dl===0?'Exam TODAY! 🔥':Math.abs(dl)+' days ago'));
    }else left.append(el('div',{style:{fontSize:'13px',color:'#64748b'}},'Tap to set your exam date'));
    row.append(left,btnEl(TM.examDate?'✏️ Edit':'Set Date','#e63946',false,()=>{TM.editDate=true;rerender()}));
    card.append(row);
  }else{
    card.append(el('div',{style:{fontSize:'12px',color:'#64748b',marginBottom:'6px'}},'Enter Exam Date'));
    const row=el('div',{style:{display:'flex',gap:'8px'}});
    const inp=el('input',{type:'date',style:{flex:'1'}});if(TM.examDate)inp.value=TM.examDate;
    row.append(inp,btnEl('Save','#22c55e',false,()=>{TM.examDate=inp.value;TM.editDate=false;saveTM(CID,TM);rerender()}),btnEl('✕','#64748b',true,()=>{TM.editDate=false;rerender()}));
    card.append(row);
  }
}

// ═══════════════════════════ INIT ═══════════════════════════
render();
