<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#070714" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SSC CGL Hub" />
<title>SSC CGL Prep Hub</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{background:#070714;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input{font-family:inherit}
::-webkit-scrollbar{display:none}
.tab-bar{display:flex;overflow-x:auto;border-bottom:1px solid #1e1e40;padding:0 8px}
.tab-btn{padding:10px 11px;background:transparent;border:none;border-bottom:2px solid transparent;color:#4a5568;font-size:11.5px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s}
.tab-btn.active{color:#7b9fff;border-bottom-color:#4361ee;font-weight:700}
.page{display:none;padding:14px;max-width:860px;margin:0 auto}
.page.active{display:block}
.card{background:#0d0d20;border-radius:12px;padding:14px;margin-bottom:10px}
.bar-bg{background:#1a1a3e;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .6s ease}
.chip{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;border:1px solid #2a2a4a;background:transparent;color:#64748b}
.chip.active{background:var(--c,#4361ee)22;border-color:var(--c,#4361ee);color:var(--c,#4361ee)}
.stat-box{border-radius:10px;padding:10px 8px;text-align:center}
.topic-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:4px;cursor:pointer;border:1px solid #1e1e3a;transition:all .15s}
.topic-row.done{background:#0d2d1a;border-color:#22c55e33}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid #3a3a5a;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.checkbox.done{border-color:var(--c);background:var(--c)}
.btn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--c,#4361ee);background:var(--c,#4361ee)22;color:var(--c,#4361ee)}
.btn.outline{background:transparent}
.btn.full{width:100%;padding:12px;font-size:14px;border-radius:10px}
.sw-display{font-size:52px;font-weight:900;font-family:monospace;letter-spacing:2px;text-align:center;padding:10px 0}
.section-title{font-size:15px;font-weight:800;margin-bottom:2px}
.label{font-size:11px;color:#64748b}
.val{font-weight:700}
.history-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1a1a3e}
.strat-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #1a1a3e;font-size:13px;line-height:1.5}
.f-row{background:#070714;border:1px solid #1e1e3a;border-radius:8px;padding:9px 13px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:5px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flex{display:flex;align-items:center}
.gap8{gap:8px}
.wrap{flex-wrap:wrap}
input[type=date],input[type=number],input[type=text]{background:#1a1a3e;border:1px solid #2a2a4a;border-radius:8px;padding:9px 12px;color:#e2e8f0;font-size:13px;width:100%}
select{background:#1a1a3e;border:1px solid #2a2a4a;border-radius:8px;padding:8px 10px;color:#e2e8f0;font-size:13px}
.hidden{display:none!important}
.running-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.freq-bar{display:flex;gap:3px;margin-bottom:8px}
.freq-seg{flex:1;height:5px;border-radius:3px;background:#1a1a3e}
.freq-seg.on{background:#4361ee}
</style>
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <div style="background:linear-gradient(135deg,#0f0f2a,#070714);border-bottom:1px solid #1e1e40;padding:14px 14px 0">

    <div class="tab-bar" id="main-tabs">
      <button class="tab-btn active" data-page="dashboard">📊 Dashboard</button>
      <button class="tab-btn" data-page="tracker">✅ Tracker</button>
      <button class="tab-btn" data-page="guide">📖 Guide</button>
      <button class="tab-btn" data-page="mock">🧪 Mock Tests</button>
      <button class="tab-btn" data-page="timer">⏱ Study Timer</button>
    </div>

  <!-- PAGES -->
  <div id="dashboard" class="page active"></div>
  <div id="tracker" class="page"></div>
  <div id="guide" class="page"></div>
  <div id="mock" class="page"></div>
  <div id="timer" class="page"></div>
</div>

<script>
// ═══════════════════════════════════════════════

  {id:"t1_reasoning",title:"Tier 1 — Reasoning",color:"#e63946",questions:[

// ═══════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════
const SK = "ssc_v4";
const TK = "ssc_timer_v2";
function load(){try{return JSON.parse(localStorage.getItem(SK)||"{}")}catch{return{}}}
function save(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch{}}
function loadT(){try{return JSON.parse(localStorage.getItem(TK)||"{}")}catch{return{}}}
function saveT(d){try{localStorage.setItem(TK,JSON.stringify(d))}catch{}}

let DB = load();
if(!DB.progress) DB.progress={};
if(!DB.mockScores) DB.mockScores={};

let TD = loadT();
if(!TD.dayData) TD.dayData={};

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function pct(d,t){return t===0?0:Math.round(d/t*100)}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtHMS(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function fmtHM(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);if(hh===0)return mm+'m';if(mm===0)return hh+'h';return hh+'h '+mm+'m'}
function impColor(i){return{"Very High":"#ef4444","High":"#f97316","Medium":"#eab308","Low":"#6b7280"}[i]||"#6b7280"}
function countTopics(tier){let t=0;Object.values(tier.sections).forEach(s=>t+=s.topics.length);return t}
function countDone(tierKey,tier){let d=0;Object.entries(tier.sections).forEach(([sk,s])=>s.topics.forEach(t=>{if(DB.progress[`${tierKey}||${sk}||${t}`])d++}));return d}
function el(id){return document.getElementById(id)}
function h(tag,attrs,children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null||c===false||c===undefined)return;
      e.appendChild(typeof c==='string'?document.createTextNode(c):c);
    });
  }
  return e;
}
function bar(percent,color,height=8){
  return h('div',{class:'bar-bg',style:{height:height+'px'}},
    [h('div',{class:'bar-fill',style:{width:percent+'%',background:`linear-gradient(90deg,${color}88,${color})`,height:'100%'}})]
  );
}
function statBox(color,label,value,sub){
  const b=h('div',{class:'stat-box',style:{background:color+'12',border:`1px solid ${color}30`}});
  b.appendChild(h('div',{style:{fontSize:'10px',color:'#64748b',marginBottom:'3px'}},label));
  b.appendChild(h('div',{class:'val',style:{fontSize:'18px',color:color}},String(value)));
  if(sub)b.appendChild(h('div',{style:{fontSize:'10px',color:'#64748b',marginTop:'2px'}},sub));
  return b;
}
function btn(label,color,outline,onClick){
  const b=h('button',{class:'btn'+(outline?' outline':''),style:{'--c':color}},label);
  if(onClick)b.addEventListener('click',onClick);
  return b;
}
function chip(label,color,active,onClick){
  const c=h('button',{class:'chip'+(active?' active':''),style:{'--c':color}},label);
  if(onClick)c.addEventListener('click',onClick);
  return c;
}

// ═══════════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════════
let currentPage='dashboard';
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
  el(id).classList.add('active');
  currentPage=id;
  renderPage(id);
}
document.getElementById('main-tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-page]');
  if(b)showPage(b.dataset.page);
});

function renderPage(id){
  const pg=el(id);
  pg.innerHTML='';
  if(id==='dashboard')renderDashboard(pg);
  else if(id==='tracker')renderTracker(pg);
  else if(id==='guide')renderGuide(pg);
  else if(id==='mock')renderMock(pg);
  else if(id==='timer')renderTimer(pg);
  updateHeader();
}

function updateHeader(){
  let gd=0,gt=0;
  Object.entries(SYLLABUS).forEach(([tk,tier])=>{gt+=countTopics(tier);gd+=countDone(tk,tier)});
  el('hdr-progress').textContent=`${gd}/${gt}`;
  el('hdr-progress').style.color=gd===gt&&gt>0?'#22c55e':'#4361ee';
}

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
function renderDashboard(pg){
  let gd=0,gt=0;
  Object.entries(SYLLABUS).forEach(([tk,tier])=>{gt+=countTopics(tier);gd+=countDone(tk,tier)});

  // Overall card
  const oc=h('div',{class:'card',style:{border:'1px solid #4361ee28',display:'flex',alignItems:'center',gap:'16px',flexWrap:'wrap'}});
  oc.appendChild(circleSVG(pct(gd,gt),'#4361ee',88));
  const od=h('div',{style:{flex:'1'}});
  od.appendChild(h('div',{style:{fontSize:'15px',fontWeight:'800'}},'Overall Progress'));
  od.appendChild(h('div',{style:{fontSize:'12px',color:'#64748b',margin:'3px 0 8px'}},[
    h('span',{style:{color:'#4361ee',fontWeight:'700'}},String(gd)),` of ${gt} topics`
  ]));
  od.appendChild(bar(pct(gd,gt),'#4361ee',10));
  od.appendChild(h('div',{style:{display:'flex',gap:'14px',marginTop:'6px'}},[
    h('span',{style:{fontSize:'12px',color:'#22c55e'}},`✓ ${gd} Done`),
    h('span',{style:{fontSize:'12px',color:'#e63946'}},`○ ${gt-gd} Left`)
  ]));
  oc.appendChild(od);
  pg.appendChild(oc);

  // Mock scores
  const scored=MOCK_TESTS.filter(t=>DB.mockScores[t.id]);
  if(scored.length>0){
    const mc=h('div',{class:'card',style:{border:'1px solid #a855f728'}});
    mc.appendChild(h('div',{style:{fontSize:'13px',fontWeight:'700',color:'#a855f7',marginBottom:'10px'}},'🧪 Recent Test Scores'));
    const g=h('div',{class:'grid2'});
    scored.forEach(t=>{
      const s=DB.mockScores[t.id],p=pct(s.correct,s.total);
      g.appendChild(statBox(t.color,t.title.split(' — ')[1],`${s.correct}/${s.total}`,p+'%'));
    });
    mc.appendChild(g);
    pg.appendChild(mc);
  }

  // Timer quick stats
  const td=TD.dayData||{};
  const today=todayKey();
  const swToday=(td[today]?.swSecs||0)/3600+(td[today]?.manualHrs||0);
  const streak=calcStreak();

function circleSVG(percent,color,size){
  const r=(size-8)/2,circ=2*Math.PI*r,dash=circ*percent/100;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',size);svg.setAttribute('height',size);svg.style.flexShrink='0';
  const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  bg.setAttribute('cx',size/2);bg.setAttribute('cy',size/2);bg.setAttribute('r',r);
  bg.setAttribute('fill','none');bg.setAttribute('stroke','#1a1a3e');bg.setAttribute('stroke-width','8');
  const fg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  fg.setAttribute('cx',size/2);fg.setAttribute('cy',size/2);fg.setAttribute('r',r);
  fg.setAttribute('fill','none');fg.setAttribute('stroke',color);fg.setAttribute('stroke-width','8');
  fg.setAttribute('stroke-dasharray',`${dash} ${circ}`);fg.setAttribute('stroke-linecap','round');
  fg.setAttribute('transform',`rotate(-90 ${size/2} ${size/2})`);
  fg.style.transition='stroke-dasharray .7s ease';
  const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
  txt.setAttribute('x',size/2);txt.setAttribute('y',size/2+1);
  txt.setAttribute('text-anchor','middle');txt.setAttribute('dominant-baseline','middle');
  txt.style.fill=color;txt.style.fontSize=size*0.2+'px';txt.style.fontWeight='800';txt.style.fontFamily='monospace';
  txt.textContent=percent+'%';
  svg.appendChild(bg);svg.appendChild(fg);svg.appendChild(txt);
  return svg;
}

    Object.entries(tier.sections).forEach(([sk,s])=>s.topics.forEach(t=>{delete DB.progress[`${trackerTier}||${sk}||${t}`]}));
    save(DB);renderPage('tracker');
  }));
  tc.appendChild(acts);
  pg.appendChild(tc);

  if(!trackerSection){
    // Section list
    Object.entries(tier.sections).forEach(([sk,sec])=>{
      const sd=sec.topics.filter(t=>DB.progress[`${trackerTier}||${sk}||${t}`]).length;
      const sp=pct(sd,sec.topics.length);
      const sc=h('div',{class:'card',style:{border:`1px solid ${sec.color}28`,cursor:'pointer'}});

      sr.appendChild(h('div',{style:{fontSize:'13px',fontWeight:'700',color:sec.color}},sk));

      ri.appendChild(h('span',{style:{fontSize:'12px',color:'#64748b'}},`${sd}/${sec.topics.length}`));

      ri.appendChild(h('span',{style:{color:'#64748b'}},'›'));
      sr.appendChild(ri);
      sc.appendChild(sr);
      sc.appendChild(bar(sp,sec.color,5));
      pg.appendChild(sc);
    });
  } else {
    // Topic list
    const sec=tier.sections[trackerSection];
    const sd=sec.topics.filter(t=>DB.progress[`${trackerTier}||${trackerSection}||${t}`]).length;
    const sp=pct(sd,sec.topics.length);

    const backBtn=btn('← Back','#64748b',true,()=>{trackerSection=null;renderPage('tracker')});
    backBtn.style.marginBottom='10px';
    pg.appendChild(backBtn);

    const sc=h('div',{class:'card',style:{border:`1px solid ${sec.color}28`}});
    const sh=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px',flexWrap:'wrap',gap:'6px'}});
    const si=h('div');
    si.appendChild(h('div',{style:{fontSize:'14px',fontWeight:'800',color:sec.color}},trackerSection));
    si.appendChild(h('div',{style:{fontSize:'12px',color:'#64748b'}},`${sd}/${sec.topics.length} done · ${sp}%`));
    sh.appendChild(si);
    const sa=h('div',{style:{display:'flex',gap:'6px'}});
    sa.appendChild(btn('✓ All','#22c55e',false,()=>{
      sec.topics.forEach(t=>{DB.progress[`${trackerTier}||${trackerSection}||${t}`]=true});
      save(DB);renderPage('tracker');
    }));
    sa.appendChild(btn('✗ Clear','#e63946',true,()=>{
      sec.topics.forEach(t=>{delete DB.progress[`${trackerTier}||${trackerSection}||${t}`]});
      save(DB);renderPage('tracker');
    }));
    sh.appendChild(sa);
    sc.appendChild(sh);
    sc.appendChild(bar(sp,sec.color,6));

    const tl=h('div',{style:{marginTop:'12px'}});
    sec.topics.forEach(topic=>{
      const key=`${trackerTier}||${trackerSection}||${topic}`;
      const done=!!DB.progress[key];
      const row=h('div',{class:'topic-row'+(done?' done':'')});
      const cb=h('div',{class:'checkbox'+(done?' done':''),style:{'--c':sec.color}});
      if(done){
        const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
        svg.setAttribute('width','12');svg.setAttribute('height','12');svg.setAttribute('viewBox','0 0 12 12');
        const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
        pl.setAttribute('points','1.5,6 5,9.5 10.5,2.5');pl.setAttribute('stroke','white');
        pl.setAttribute('stroke-width','2');pl.setAttribute('fill','none');
        pl.setAttribute('stroke-linecap','round');pl.setAttribute('stroke-linejoin','round');
        svg.appendChild(pl);cb.appendChild(svg);
      }
      row.appendChild(cb);
      row.appendChild(h('span',{style:{fontSize:'13px',color:done?'#86efac':'#cbd5e1',textDecoration:done?'line-through':'none',flex:'1'}},topic));
      if(done)row.appendChild(h('span',{style:{fontSize:'11px',color:'#22c55e'}},'✓'));
      row.addEventListener('click',()=>{
        if(done)delete DB.progress[key]; else DB.progress[key]=true;
        save(DB);renderPage('tracker');
      });
      tl.appendChild(row);
    });
    sc.appendChild(tl);
    pg.appendChild(sc);
  }
}

let swRunning=false, swElapsed=0, swStartTs=null, swBase=0;
let timerInterval=null;

function calcStreak(){
  const td=TD.dayData||{};
  let streak=0;
  const checkDate=new Date();
  const todayH=(td[todayKey()]?.swSecs||0)/3600+(td[todayKey()]?.manualHrs||0);
  if(todayH<2) checkDate.setDate(checkDate.getDate()-1);
  for(let i=0;i<365;i++){
    const dk=`${checkDate.getFullYear()}-${String(checkDate.getMonth()+1).padStart(2,'0')}-${String(checkDate.getDate()).padStart(2,'0')}`;
    const h=(td[dk]?.swSecs||0)/3600+(td[dk]?.manualHrs||0);
    if(h>=2){streak++;checkDate.setDate(checkDate.getDate()-1);}else break;
  }
  return streak;
}

function initTimer(){
  if(TD.swRunning&&TD.swStartTs){
    swStartTs=TD.swStartTs; swBase=TD.swBase||0;
    swElapsed=swBase+Math.floor((Date.now()-swStartTs)/1000);
    swRunning=true;
    timerInterval=setInterval(()=>{
      swElapsed=swBase+Math.floor((Date.now()-swStartTs)/1000);
      // update display if on timer page
      const disp=document.getElementById('sw-display');
      if(disp)disp.textContent=fmtHMS(swElapsed);
      const today=todayKey();
      TD.dayData[today]=TD.dayData[today]||{swSecs:0,manualHrs:0};
      TD.dayData[today].swSecs=swElapsed;
      updateTimerStats();
    },1000);
  }
}

function updateTimerStats(){
  const today=todayKey();
  const swH=(TD.dayData[today]?.swSecs||0)/3600;
  const mnH=TD.dayData[today]?.manualHrs||0;
  const tot=swH+mnH;
  const swEl=document.getElementById('stat-sw');if(swEl)swEl.textContent=fmtHM(swH);
  const mnEl=document.getElementById('stat-mn');if(mnEl)mnEl.textContent=fmtHM(mnH);
  const totEl=document.getElementById('stat-tot');if(totEl){totEl.textContent=fmtHM(tot);totEl.style.color=tot>=2?'#22c55e':'#e63946';}
  const goalPct=Math.min(100,tot/2*100);
  const goalBar=document.getElementById('goal-bar');if(goalBar){goalBar.style.width=goalPct+'%';goalBar.style.background=tot>=2?'#22c55e':'#4361ee';}
  const goalPctEl=document.getElementById('goal-pct');if(goalPctEl)goalPctEl.textContent=Math.round(goalPct)+'%';
  const streakEl=document.getElementById('stat-streak');if(streakEl)streakEl.textContent=calcStreak()+' days';
}

  pg.appendChild(mc);

  // History
  const allDays=Object.keys(TD.dayData).filter(dk=>(TD.dayData[dk]?.swSecs||0)+(TD.dayData[dk]?.manualHrs||0)>0).sort().reverse();
  if(allDays.length>0){
    const hc=h('div',{class:'card',style:{border:'1px solid #94a3b828'}});
    hc.appendChild(h('div',{style:{fontSize:'13px',fontWeight:'700',color:'#94a3b8',marginBottom:'10px'}},'📅 Study History'));
    const PAGE_SIZE=10;
    const pageStart=histPage*PAGE_SIZE;
    const pageDays=allDays.slice(pageStart,pageStart+PAGE_SIZE);
    pageDays.forEach(dk=>{
      const d=TD.dayData[dk];
      const sw2=(d?.swSecs||0)/3600,mn2=d?.manualHrs||0,tot2=sw2+mn2;
      const dateObj=new Date(dk+'T00:00:00');
      const lbl=dateObj.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
      const isToday2=dk===today;
      const row=h('div',{class:'history-row'});
      const dot=h('div',{style:{width:'6px',height:'6px',borderRadius:'50%',background:tot2>=2?'#22c55e':tot2>0?'#f97316':'#4a5568',flexShrink:'0'}});
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('div',{style:{fontSize:'12px',color:isToday2?'#4361ee':'#94a3b8',fontWeight:isToday2?'700':'400'}},lbl+(isToday2?' (today)':'')));
      const parts=[];
      if(sw2>0)parts.push(`⏱ ${fmtHM(sw2)}`);
      if(mn2>0)parts.push(`✍️ ${fmtHM(mn2)}`);
      info.appendChild(h('div',{style:{fontSize:'11px',color:'#475569',marginTop:'1px'}},parts.join(' + ')));
      const tVal=h('div',{style:{textAlign:'right'}});
      tVal.appendChild(h('div',{style:{fontSize:'14px',fontWeight:'800',color:tot2>=2?'#22c55e':tot2>=1?'#f97316':'#e63946'}},fmtHM(tot2)));
      if(tot2>=2)tVal.appendChild(h('div',{style:{fontSize:'10px',color:'#22c55e'}},'🔥 streak'));
      row.appendChild(dot);row.appendChild(info);row.appendChild(tVal);
      hc.appendChild(row);
    });
    const totalPages=Math.ceil(allDays.length/PAGE_SIZE);
    if(totalPages>1){
      const pRow=h('div',{style:{display:'flex',justifyContent:'center',gap:'8px',marginTop:'10px',alignItems:'center'}});
      const prevBtn=btn('← Prev','#64748b',true,()=>{histPage--;renderPage('timer')});
      prevBtn.disabled=histPage===0;
      pRow.appendChild(prevBtn);
      pRow.appendChild(h('span',{style:{fontSize:'12px',color:'#64748b',padding:'6px 0'}},`Page ${histPage+1}/${totalPages}`));
      const nextBtn=btn('Next →','#64748b',true,()=>{histPage++;renderPage('timer')});
      nextBtn.disabled=histPage===totalPages-1;
      pRow.appendChild(nextBtn);
      hc.appendChild(pRow);
    }
    pg.appendChild(hc);
  }
}

function renderExamSection(examCard){
  examCard.innerHTML='';
  if(!TD.editingExam){
    const row=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
    const left=h('div');
    left.appendChild(h('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'2px'}},'📅 Exam Date'));
    if(TD.examDate){
      const dl=Math.ceil((new Date(TD.examDate)-new Date(new Date().toDateString()))/86400000);
      left.appendChild(h('div',{style:{fontSize:'13px',fontWeight:'700',color:'#e2e8f0'}},new Date(TD.examDate).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})));
      const dlColor=dl<=30?'#e63946':dl<=90?'#f97316':'#22c55e';
      left.appendChild(h('div',{style:{fontSize:'20px',fontWeight:'900',color:dlColor,marginTop:'2px'}},dl>0?`${dl} days left`:dl===0?'Exam is TODAY! 🔥':`${Math.abs(dl)} days ago`));
    } else {
      left.appendChild(h('div',{style:{fontSize:'13px',color:'#64748b'}},'Tap to set your exam date'));
    }
    row.appendChild(left);
    row.appendChild(btn(TD.examDate?'✏️ Edit':'Set Date','#e63946',false,()=>{TD.editingExam=true;renderPage('timer')}));
    examCard.appendChild(row);
  } else {
    examCard.appendChild(h('div',{style:{fontSize:'12px',color:'#64748b',marginBottom:'6px'}},'Enter Exam Date'));
    const row=h('div',{style:{display:'flex',gap:'8px'}});
    const inp=h('input',{type:'date',style:{flex:'1'}});
    if(TD.examDate)inp.value=TD.examDate;
    const saveBtn=btn('Save','#22c55e',false,()=>{TD.examDate=inp.value;TD.editingExam=false;saveT(TD);renderPage('timer')});
    const cancelBtn=btn('✕','#64748b',true,()=>{TD.editingExam=false;renderPage('timer')});
    row.appendChild(inp);row.appendChild(saveBtn);row.appendChild(cancelBtn);
    examCard.appendChild(row);
  }
}

// ═══════════════════════════════════════════════
initTimer();
renderPage('dashboard');
</script>
