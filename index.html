    //  STORAGE — localStorage for PWA offline support
    // ══════════════════════════════════════════════════════════════
    const STORAGE_KEY = "ssc_cgl_progress_v1";
    function loadProgress() {
      try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : {}; }
      catch { return {}; }
    }
    function saveProgress(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
    }

    //  SHARED HELPERS
    // ══════════════════════════════════════════════════════════════
    function countTopics(tier) { let t = 0; Object.values(tier.sections).forEach(s => t += s.topics.length); return t; }
    function countDone(tier, tk, prog) { let d = 0; Object.entries(tier.sections).forEach(([sk, s]) => s.topics.forEach(t => { if (prog[`${tk}||${sk}||${t}`]) d++; })); return d; }
    const pct = (d, t) => t === 0 ? 0 : Math.round((d / t) * 100);
    const impColor = (i) => ({ "Very High": "#ef4444", "High": "#f97316", "Medium": "#eab308", "Low": "#6b7280" }[i] || "#6b7280");

    function LinearBar({ percent, color, height = 8 }) {
      return (
        <div style={{ background: "#1a1a3e", borderRadius: 99, height, overflow: "hidden" }}>
          <div style={{ width: `${percent}%`, height: "100%", background: `linear-gradient(90deg,${color}88,${color})`, borderRadius: 99, transition: "width 0.5s ease" }} />
        </div>
      );
    }

    function CircleProgress({ percent, color, size = 80, stroke = 8 }) {
      const r = (size - stroke) / 2;
      const circ = 2 * Math.PI * r;
      const offset = circ - (percent / 100) * circ;
      return (
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)", flexShrink: 0 }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1a1a3e" strokeWidth={stroke} />
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
            strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
            style={{ transition: "stroke-dashoffset 0.6s ease" }} />
          <text x={size/2} y={size/2} textAnchor="middle" dominantBaseline="middle"
            style={{ transform:`rotate(90deg)`, transformOrigin:`${size/2}px ${size/2}px` }}
            fill={color} fontSize={size * 0.2} fontWeight={800}>{percent}%</text>
        </svg>
      );
    }

    function FreqBar({ freq, max = 10 }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ flex: 1, background: "#1a1a3e", borderRadius: 4, height: 7, overflow: "hidden" }}>
            <div style={{ width: `${(freq/max)*100}%`, height: "100%", background: "linear-gradient(90deg,#4361ee,#7b2ff7)", borderRadius: 4, transition: "width 0.6s ease" }} />
          </div>
          <span style={{ fontSize: 11, color: "#aaa", minWidth: 22 }}>~{freq}</span>
        </div>
      );
    }

                  <button onClick={()=>setActiveSection(null)} style={{ ...S.btn("#64748b",true), marginBottom:10 }}>← Back</button>
                  <div style={S.card(sec.color)}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8, flexWrap:"wrap", gap:6 }}>
                      <div>
                        <div style={{ fontSize:14, fontWeight:800, color:sec.color }}>{activeSection}</div>
                        <div style={{ fontSize:12, color:"#64748b" }}>{sd}/{sec.topics.length} done · {sp}%</div>
                      </div>
                      <div style={{ display:"flex", gap:6 }}>
                        <button onClick={()=>markAllSec(activeTier,activeSection,sec.topics,true)} style={S.btn("#22c55e")}>✓ All</button>
                        <button onClick={()=>markAllSec(activeTier,activeSection,sec.topics,false)} style={S.btn("#e63946",true)}>✗ Clear</button>
                      </div>
                    </div>
                    <LinearBar percent={sp} color={sec.color} height={6} />
                    <div style={{ marginTop:12 }}>
                      {sec.topics.map(topic=>{
                        const key=`${activeTier}||${activeSection}||${topic}`;
                        const done=!!progress[key];
                        return (
                          <div key={topic} style={S.topicRow(done)} onClick={()=>toggle(activeTier,activeSection,topic)}>
                            <div style={S.checkbox(done,sec.color)}>
                              {done && <svg width="12" height="12" viewBox="0 0 12 12"><polyline points="1.5,6 5,9.5 10.5,2.5" stroke="white" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                            </div>
                            <span style={{ fontSize:13, color:done?"#86efac":"#cbd5e1", textDecoration:done?"line-through":"none", flex:1 }}>{topic}</span>
                            {done && <span style={{ fontSize:11, color:"#22c55e" }}>✓</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            })()}
          </div>
        );
      };

      // ── GUIDE ─────────────────────────────────────────────────
      const guideTabs = [
        ["overview","📊 Overview"],
        ["tier1","🔵 Tier 1"],
        ["tier2","🟣 Tier 2"],
        ["formulas","📐 Formulas"],
        ["plan","🗓 Study Plan"],
      ];

      const renderGuide = () => (
        <div>
          <div style={{ display:"flex", gap:2, overflowX:"auto", scrollbarWidth:"none", marginBottom:14, borderBottom:"1px solid #2a2a4a", paddingBottom:0 }}>
            {guideTabs.map(([id,label])=>(
              <button key={id} onClick={()=>setGuideTab(id)} style={S.tab(guideTab===id)}>{label}</button>
            ))}
          </div>
          {guideTab==="overview" && <GuideOverview />}
          {guideTab==="tier1"    && <GuideTier sections={GUIDE.tier1.sections} />}
          {guideTab==="tier2"    && <GuideTier sections={GUIDE.tier2.papers} />}
          {guideTab==="formulas" && <GuideFormulas />}
          {guideTab==="plan"     && <GuideStudyPlan />}
        </div>
      );

      // ── ROOT ──────────────────────────────────────────────────
      const mainTabs = [
        ["dashboard","📊 Dashboard"],
        ["tracker","✅ Tracker"],
        ["guide","📖 Study Guide"],
      ];

      return (
        <div style={S.app}>
          <div style={S.header}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <h1 style={S.title}>SSC CGL Prep Hub</h1>
              <div style={{ fontSize:12, color: grandDone===grandTotal&&grandTotal>0?"#22c55e":"#4361ee", fontWeight:700 }}>
                {grandDone}/{grandTotal}
              </div>
            </div>
            <div style={{ fontSize:11, color:"#475569", marginTop:2 }}>Tier 1 + Tier 2 Paper I · Progress auto-saves</div>
            <div style={S.tabs}>
              {mainTabs.map(([id,label])=>(
                <button key={id} onClick={()=>setActiveTab(id)} style={S.tab(activeTab===id)}>{label}</button>
              ))}
            </div>
          </div>
          <div style={S.content}>
            {activeTab==="dashboard" && renderDashboard()}
            {activeTab==="tracker"   && renderTracker()}
            {activeTab==="guide"     && renderGuide()}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    // ── SERVICE WORKER REGISTRATION ──────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }

    // ── OFFLINE / ONLINE TOAST ───────────────────────────────────
    const toast = document.getElementById('offline-toast');
    window.addEventListener('offline', () => { toast.classList.add('show'); });
    window.addEventListener('online',  () => { toast.classList.remove('show'); });

    // ── PWA INSTALL BANNER ───────────────────────────────────────
    let deferredPrompt;
    const banner  = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');
    const dismissBtn = document.getElementById('dismiss-btn');

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      // Only show if not already dismissed
      if (!sessionStorage.getItem('pwa-dismissed')) banner.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      banner.classList.remove('show');
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install outcome:', outcome);
        deferredPrompt = null;
      }
    });

    dismissBtn.addEventListener('click', () => {
      banner.classList.remove('show');
      sessionStorage.setItem('pwa-dismissed', '1');
    });

    window.addEventListener('appinstalled', () => {
      banner.classList.remove('show');
      deferredPrompt = null;
    });
  </script>
</body>
</html>
